<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca</title>
</head>
<body>
    <h1>Biblioteca</h1>
    <ul>
        {% for book in books %}
            <li>
                <a href="{% url 'book_detail' book.pk %}">{{ book.title }}</a>
                — {{ book.author.name }}
            </li>
        {% empty %}
            <li>No hay libros registrados.</li>
        {% endfor %}
    </ul>
</body>
</html>
